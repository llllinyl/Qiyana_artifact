[package]
name = "qiyana0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nonprivate_server"
path = "src/nonprivate/nonprivate_server.rs"
test = false

[[bin]]
name = "nonprivate_client"
path = "src/nonprivate/nonprivate_client.rs"
test = false

[[bin]]
name = "baseline_server"
path = "src/baseline/baseline_server.rs"
test = false

[[bin]]
name = "baseline_client"
path = "src/baseline/baseline_client.rs"
test = false

[[bin]]
name = "qiyana1_server"
path = "src/qiyana1/qiyana1_server.rs"
test = false

[[bin]]
name = "qiyana1_client"
path = "src/qiyana1/qiyana1_client.rs"
test = false

[[bin]]
name = "qiyana0_server"
path = "src/qiyana0/qiyana0_server.rs"
test = false

[[bin]]
name = "qiyana0_client"
path = "src/qiyana0/qiyana0_client.rs"
test = false

[[bin]]
name = "baselineclient"
path = "src/baseline/client.rs"
test = false

[[bin]]
name = "baselinemaster"
path = "src/baseline/master.rs"
test = false

[[bin]]
name = "baselineworker"
path = "src/baseline/worker.rs"
test = false

[[bin]]
name = "qiyana0client"
path = "src/qiyana0/client.rs"
test = false

[[bin]]
name = "qiyana0master"
path = "src/qiyana0/master.rs"
test = false

[[bin]]
name = "qiyana0worker"
path = "src/qiyana0/worker.rs"
test = false

[[bin]]
name = "qiyana1client"
path = "src/qiyana1/client.rs"
test = false

[[bin]]
name = "qiyana1master"
path = "src/qiyana1/master.rs"
test = false

[[bin]]
name = "qiyana1worker"
path = "src/qiyana1/worker.rs"
test = false

[dependencies]
tfhe = { version = "*", features = ["boolean", "shortint", "integer", "strings"] }
rayon = "1.6.1"
bincode = "1.3.3"
rand = "0.8"
itertools = "0.10"
crossbeam = "0.8"
rand_chacha = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
