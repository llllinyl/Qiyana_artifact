[package]
name = "qiyana"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "baseline_server"
path = "src/baseline/baseline_server.rs"
test = false

[[bin]]
name = "baseline_client"
path = "src/baseline/baseline_client.rs"
test = false

[[bin]]
name = "qiyanawosel_server"
path = "src/qiyanawosel/qiyanawosel_server.rs"
test = false

[[bin]]
name = "qiyanawosel_client"
path = "src/qiyanawosel/qiyanawosel_client.rs"
test = false

[[bin]]
name = "qiyana_server"
path = "src/qiyana/qiyana_server.rs"
test = false

[[bin]]
name = "qiyana_client"
path = "src/qiyana/qiyana_client.rs"
test = false

[[bin]]
name = "qiyanawoselclient"
path = "src/qiyanawosel/client.rs"

[[bin]]
name = "qiyanawoselmaster"
path = "src/qiyanawosel/master.rs"

[[bin]]
name = "qiyanawoselworker"
path = "src/qiyanawosel/worker.rs"

[[bin]]
name = "baselineclient"
path = "src/baseline/client.rs"

[[bin]]
name = "baselinemaster"
path = "src/baseline/master.rs"

[[bin]]
name = "baselineworker"
path = "src/baseline/worker.rs"

[dependencies]
tfhe = { version = "*", features = ["boolean", "shortint", "integer", "strings"] }
rayon = "1.6.1"
bincode = "1.3.3"
rand = "0.8"
itertools = "0.10"
crossbeam = "0.8"
rand_chacha = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"